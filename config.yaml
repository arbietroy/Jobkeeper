# ─────────────────────────────────────────────────────────────────────────────
#  Jobkeeper config. Edit this file to tell the agent who you are and where to look.
#  Secrets (API keys, bot token) do NOT go here — see README.md.
# ─────────────────────────────────────────────────────────────────────────────

profile:
  # Describe yourself the way you'd brief a recruiter. The AI reads this to judge every opportunity,
  # so the more honest and specific, the better. ✏️ Fix anything that isn't right — especially the tools.
  about: |
    Nigerian, living in Nigeria. Early-career, looking for my first proper role in AI automation.
    Background: I design and build websites for brands and small businesses (HTML, CSS, JavaScript,
    WordPress / no-code site builders), so I'm comfortable with web tech, clients and shipping work.
    Target roles: AI automation specialist / assistant, junior automation or workflow builder,
    no-code / low-code developer, AI agent or chatbot builder, AI operations assistant, junior
    integrations or implementation specialist, prompt engineering, and similar entry-level AI roles.
    Tools I use or am learning: n8n, Make (Integromat), Zapier, ChatGPT / Claude / OpenAI API,
    Airtable, Google Sheets, APIs and webhooks.

  preferences: |
    - MUST be open to someone living in Nigeria: remote worldwide / anywhere / Africa / EMEA / Nigeria,
      or a Nigerian company. No US/UK/EU-only roles, no work-authorization or visa requirements.
    - Entry-level, junior, internship, graduate or trainee. Nothing senior, lead or manager-level,
      nothing asking for 3+ years of experience.
    - Full-time, part-time, contract or freelance are all fine. Paid work only.
    - Web development roles are OK only if junior and open to Nigeria; AI automation comes first.

  # Used to query job boards that support search.
  search_terms:
    - automation
    - ai automation
    - n8n
    - zapier
    - no-code
    - ai agent
    - chatbot
    - prompt engineer
    - junior web developer

filters:
  # A job's TITLE (or tags) must contain at least one of these as a whole word. Matching the title
  # instead of the whole description is what keeps unrelated jobs out.
  match_keywords_in: title   # title | anywhere
  include_keywords:
    - automation
    - automations
    - automate
    - n8n
    - zapier
    - make.com
    - integromat
    - workflow
    - workflows
    - no-code
    - nocode
    - low-code
    - ai
    - a.i.
    - llm
    - gpt
    - chatgpt
    - chatbot
    - chatbots
    - conversational
    - prompt
    - ai agent
    - ai agents
    - agentic
    - integration
    - integrations
    - implementation
    - rpa
    - airtable
    - junior web developer
    - junior frontend
    - junior front-end
    - web developer intern
    - wordpress
  # Anything mentioning these anywhere is dropped before the AI sees it.
  exclude_keywords:
    - "[for hire]"
    - unpaid
    - "equity only"
    - commission only
    - security clearance
  entry_level_only: true          # drop senior / lead / manager titles and "4+ years experience"
  require_nigeria_eligible: true  # drop jobs limited to other countries or needing work authorization
  max_age_days: 10                # ignore posts older than this
  min_score: 65                   # AI fit score (0-100) needed to be sent to you

ai:
  enabled: true
  # Model used to score opportunities and run the web hunt.
  # claude-opus-5-5 is the most accurate. For lower cost use claude-sonnet-5-5 or claude-haiku-5-5.
  model: claude-opus-5-5
  effort: low              # scoring is a simple judgement; low keeps it fast and cheap
  max_items_per_run: 120   # cap on items sent to the AI per run

telegram:
  max_messages_per_run: 15 # extra matches wait for the next run instead of flooding you

sources:
  # ── Job boards (free, no keys needed) ──────────────────────────────────────
  remotive:       { enabled: true }
  remoteok:       { enabled: true }
  weworkremotely: { enabled: true }
  jobicy:         { enabled: true }
  himalayas:      { enabled: true }
  arbeitnow:      { enabled: false }  # mostly on-site jobs in Germany
  hackernews:     { enabled: true }   # monthly "Who is hiring?" + "Seeking freelancer?" threads

  # ── Reddit: hiring subs (jobs) + people asking for a website (leads) ──────
  reddit:
    enabled: true
    job_subreddits: [forhire, hiring, jobbit, freelance_forhire, remotejs, WebDeveloperJobs, DesignJobs]
    lead_searches:
      - { sub: smallbusiness, query: '"need a website" OR "website for my business" OR "build a website"' }
      - { sub: Entrepreneur,  query: '"need a website" OR "looking for a web designer" OR "website developer"' }
      - { sub: startups,      query: '"looking for a developer" OR "need a website"' }
      - { sub: all,           query: '"looking for a web designer" OR "need someone to build a website"' }

  # ── Claude searches the whole web: LinkedIn, X, Instagram, Facebook, forums, niche boards ──
  # Needs ANTHROPIC_API_KEY. Each run uses up to max_searches web searches (billed per search).
  web_search:
    enabled: true
    max_searches: 20
    max_results: 25
    effort: medium
    queries:
      - '"junior" "AI automation" remote worldwide'
      - '"n8n" OR "make.com" OR "zapier" automation specialist remote "anywhere"'
      - site:linkedin.com/posts hiring "AI automation" remote Africa OR worldwide
      - site:linkedin.com/posts "looking for" "n8n" OR "zapier" OR "make.com" automation
      - site:x.com hiring "automation" "n8n" OR "make.com" remote
      - '"AI automation" internship OR "entry level" remote Nigeria OR Africa'
      - site:jobberman.com AI OR automation
      - site:myjobmag.com "automation" OR "AI"
      - site:wellfound.com "automation" junior remote worldwide
      - community.n8n.io hiring OR "looking for" n8n developer
      - '"AI agent" OR "chatbot" developer junior remote "open to all countries"'

  # ── Google Maps: local businesses with no website (or only an Instagram/Facebook page) ──
  # Needs GOOGLE_MAPS_API_KEY with "Places API (New)" enabled. ✏️ Replace <your city>.
  google_places:
    enabled: false
    min_reviews: 5   # only established businesses
    queries:
      - restaurants in <your city>
      - boutiques in <your city>
      - beauty salons in <your city>
      - real estate agents in <your city>
      - event planners in <your city>

  # ── Your own RSS feeds ──────────────────────────────────────────────────────
  # Use rss.app / FetchRSS / Zapier to turn a LinkedIn job search, an X search, an Instagram
  # hashtag or a Facebook page into an RSS link, and paste it here.
  rss:
    enabled: false
    feeds:
      # - { name: "LinkedIn: web developer remote", url: "https://rss.app/feeds/XXXX.xml", kind: job }
      # - { name: "X: need a website",              url: "https://rss.app/feeds/YYYY.xml", kind: lead }
