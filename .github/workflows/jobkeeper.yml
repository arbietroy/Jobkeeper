name: Jobkeeper hunt

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch:          # "Run workflow" button for a manual run
    inputs:
      mode:
        description: "hunt = search for jobs now, ping = just send a Telegram test message"
        type: choice
        options: [hunt, ping]
        default: hunt

permissions:
  contents: write             # to save state/seen.json so you never get duplicates

concurrency:
  group: jobkeeper
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Hunt for jobs and leads
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python -m jobkeeper ${{ inputs.mode == 'ping' && 'ping' || 'run' }}

      - name: Save what was already sent
        if: always()
        run: |
          git config user.name "jobkeeper-bot"
          git config user.email "jobkeeper-bot@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || git commit -m "Update seen opportunities [skip ci]"
          git pull --rebase --autostash && git push
